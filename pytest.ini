[pytest]
# Formal regression suite. Archived snapshots and temporary labs have separate
# commands and duplicate module names; they must not be collected as this app.
testpaths = tests
addopts = --strict-markers
markers =
    unit: Configuration, geometry and pure input/state logic
    integration: Real algorithm and workflow integration
    gui: Offscreen Qt delivery and interaction (not game validation)
    resources: Official asset and fingerprint inventory
    tools: Asset maintenance, legacy adapters and build manifests
    release: Explicit isolated environment and built executable acceptance
